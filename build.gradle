plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'org.springframework.boot' version '3.2.12'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'springio'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation project(':movie-service-utils')
    implementation("org.springframework.boot:spring-boot-starter-web")
    implementation("org.springframework.boot:spring-boot-starter-validation")
    testImplementation("org.springframework.boot:spring-boot-starter-test")
    implementation platform('software.amazon.awssdk:bom:2.31.40')
    implementation 'software.amazon.awssdk:appconfig'
    implementation("org.json:json:20250107")
    implementation("org.apache.logging.log4j:log4j-api:2.25.5")
}

test {
    useJUnitPlatform()
}
